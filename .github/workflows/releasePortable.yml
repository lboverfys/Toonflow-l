name: 发布 Windows 便携版
run-name: 发布 Windows 便携版 ${{ inputs.version || '自动版本' }}

on:
  push:
    branches: [master]
    paths-ignore:
      - docs/**
      - README.md
      - AGENTS.md
  workflow_dispatch:
    inputs:
      version:
        description: 留空自动递增；也可指定更高版本号（例如 2.1.0）
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: toonflow-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    name: 自动确定发布版本
    runs-on: windows-2025
    timeout-minutes: 5
    outputs:
      version: ${{ steps.parameters.outputs.version }}
      needed: ${{ steps.parameters.outputs.needed }}
    steps:
      - name: 校验版本与发布来源
        id: parameters
        env:
          releaseVersion: ${{ inputs.version }}
          defaultBranch: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/$env:defaultBranch") { throw '请从仓库默认分支运行此发布流程' }
          $version = ([string]$env:releaseVersion).Trim()
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $head = Invoke-RestMethod "$api/git/ref/heads/$env:defaultBranch" -Headers $headers -TimeoutSec 30
          if ($head.object.sha -ne $env:GITHUB_SHA) {
            'needed=false' >> $env:GITHUB_OUTPUT
            '分支已有更新的提交，跳过此旧任务。' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $latest = Invoke-RestMethod "$api/releases/latest" -Headers $headers -TimeoutSec 30
          if ($latest.tag_name -notmatch '^portable-v(\d+\.\d+\.\d+)$') { throw '当前最新版不是便携版，请先检查 Releases' }
          $current = [version]$Matches[1]
          if (!$version -and $latest.target_commitish -eq $env:GITHUB_SHA) {
            'needed=false' >> $env:GITHUB_OUTPUT
            '此提交已经发布，跳过重复构建。' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if (!$version) {
            $patch = $current.Build
            # ACT: 分页只保留最大补丁号，避开失败草稿和已有版本，不逐条查询发布记录。
            for ($page = 1; ; $page++) {
              $releases = Invoke-RestMethod "$api/releases?per_page=100&page=$page" -Headers $headers -TimeoutSec 30
              foreach ($release in $releases) {
                if ($release.tag_name -notmatch '^portable-v(\d+\.\d+\.\d+)$') { continue }
                $used = [version]$Matches[1]
                if ($used.Major -eq $current.Major -and $used.Minor -eq $current.Minor) { $patch = [Math]::Max($patch, $used.Build) }
              }
              if ($releases.Count -lt 100) { break }
            }
            $version = '{0}.{1}.{2}' -f $current.Major, $current.Minor, ($patch + 1)
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw '版本号必须为 X.Y.Z，不带 v 前缀' }
          if ([version]$version -le $current) { throw '新版本必须高于当前正式版本' }
          foreach ($endpoint in @("git/ref/tags/portable-v$version", "releases/tags/portable-v$version")) {
            $existing = Invoke-WebRequest "$api/$endpoint" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30
            if ($existing.StatusCode -eq 200) { throw '同名版本标签或发布已存在，请检查 Releases；不覆盖已有版本' }
            if ($existing.StatusCode -ne 404) { throw "无法确认版本是否存在：HTTP $($existing.StatusCode)" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          'needed=true' >> $env:GITHUB_OUTPUT
          "本次发布版本：$version" >> $env:GITHUB_STEP_SUMMARY

  build:
    name: 构建 Windows x64 便携包
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      appVersion: ${{ needs.prepare.outputs.version }}
    outputs:
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 准备 D 盘构建目录
        run: |
          if (!(Test-Path -LiteralPath 'D:\')) { throw '运行器没有 D 盘，停止构建' }
          if ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE) -ne 'D:\') { throw '源码工作区必须位于 D 盘' }
          $root = "D:\toonflowPortableBuild\$env:GITHUB_RUN_ID\$env:GITHUB_RUN_ATTEMPT"
          $paths = @{
            TEMP = "$root\temp"
            TMP = "$root\temp"
            BUN_INSTALL_CACHE_DIR = "$root\cache\bun"
            BUN_RUNTIME_TRANSPILER_CACHE_PATH = "$root\cache\transpiler"
            HUTCH_HOME = "$root\envs\hutch"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            New-Item -ItemType Directory -Path $entry.Value -Force | Out-Null
            "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_ENV
          }
          "portableBuildRoot=$root" >> $env:GITHUB_ENV
          "portableOutput=$root\artifacts\$env:appVersion" >> $env:GITHUB_ENV
      - name: 准备锁定版本的 Bun 便携环境
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manager = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).packageManager
          if ($manager -notmatch '^bun@(\d+\.\d+\.\d+)$') { throw 'packageManager 必须固定 Bun 版本' }
          $version = $Matches[1]
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod "https://api.github.com/repos/oven-sh/bun/releases/tags/bun-v$version" -Headers $headers -TimeoutSec 30
          $assets = @($release.assets | Where-Object name -eq 'bun-windows-x64.zip')
          if ($assets.Count -ne 1 -or $assets[0].digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Bun 官方归档或校验值缺失' }
          $archive = Join-Path $env:TEMP 'bun.zip'
          Invoke-WebRequest $assets[0].browser_download_url -OutFile $archive -TimeoutSec 180
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $assets[0].digest.Substring(7)) { throw 'Bun 下载校验失败' }
          $runtime = Join-Path $env:portableBuildRoot 'envs\bun'
          Expand-Archive -LiteralPath $archive -DestinationPath $runtime
          $bin = Join-Path $runtime 'bun-windows-x64'
          $actualVersion = & (Join-Path $bin 'bun.exe') --version
          if ($LASTEXITCODE -ne 0 -or $actualVersion.Trim() -ne $version) { throw 'Bun 运行版本不匹配' }
          $bin >> $env:GITHUB_PATH
      - name: 安装项目依赖
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw '依赖安装失败' }
      - name: 准备 Electrobun SDK
        run: |
          bun apps/desktop/node_modules/electrobun/bin/electrobun.cjs prepare
          if ($LASTEXITCODE -ne 0) { throw '桌面 SDK 准备失败' }
      - name: 类型检查
        run: |
          bun run --filter '@toonflow/web' --filter '@toonflow/server' --filter '@toonflow/desktop' typecheck
          if ($LASTEXITCODE -ne 0) { throw '类型检查失败' }
      - name: 构建桌面程序
        env:
          generateUpdatePatch: "0"
        run: |
          bun run build:desktop
          if ($LASTEXITCODE -ne 0) { throw '桌面构建失败' }
      - name: 打包便携版和在线更新包
        run: |
          bun apps/desktop/scripts/packagePortableWindows.ts "$env:portableOutput"
          if ($LASTEXITCODE -ne 0) { throw '便携版打包失败' }
      - name: 保存三个发布文件
        uses: actions/upload-artifact@v7
        with:
          name: toonflowPortable-${{ needs.prepare.outputs.version }}
          path: |
            ${{ env.portableOutput }}/toonflowPortable.zip
            ${{ env.portableOutput }}/stable-win-x64-toonflowPortable.tar.zst
            ${{ env.portableOutput }}/stable-win-x64-portable-update.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: 核对附件并发布最新版
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      releaseVersion: ${{ needs.build.outputs.version }}
      artifactDirectory: D:/toonflowPortablePublish/${{ github.run_id }}/${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: toonflowPortable-${{ needs.build.outputs.version }}
          path: ${{ env.artifactDirectory }}
      - name: 校验发布包
        run: |
          $names = @('toonflowPortable.zip', 'stable-win-x64-toonflowPortable.tar.zst', 'stable-win-x64-portable-update.json')
          $files = @(Get-ChildItem -LiteralPath $env:artifactDirectory -File)
          if ($files.Count -ne $names.Count -or (Compare-Object ($files.Name | Sort-Object) ($names | Sort-Object))) { throw '发布文件清单不一致' }
          $manifest = Get-Content -LiteralPath (Join-Path $env:artifactDirectory $names[2]) -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or $manifest.version -ne $env:releaseVersion -or $manifest.distribution -ne 'portable' -or $manifest.identifier -ne 'local.toonflow.desktop' -or $manifest.channel -ne 'stable' -or $manifest.platform -ne 'win' -or $manifest.arch -ne 'x64' -or $manifest.hash -notmatch '^[a-f0-9]{64}$' -or $manifest.artifact.file -ne $names[1]) { throw '便携更新清单不符合当前版本' }
          $archive = Get-Item -LiteralPath (Join-Path $env:artifactDirectory $names[1])
          if ($archive.Length -ne $manifest.artifact.size -or (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.artifact.sha256) { throw '更新包长度或 SHA-256 不匹配' }
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $env:artifactDirectory $names[0]))
          $version = $null
          $entries = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          try {
            foreach ($entry in $zip.Entries) {
              $name = $entry.FullName.Replace('\', '/')
              if (!$entries.Add($name) -or $name.Split('/') -contains '..') { throw 'ZIP 包含重复或越界路径' }
              if ($name -ne 'toonflowPortable/' -and !$name.StartsWith('toonflowPortable/runtime/') -and $name -notin @('toonflowPortable/toonflow.exe', 'toonflowPortable/readme.md', 'toonflowPortable/license.txt')) { throw 'ZIP 包含程序范围外的文件或个人数据目录' }
              if ($name -match '(^|/)(\.env($|\.)|settings\.json$)') { throw 'ZIP 包含不应发布的配置文件' }
              if ($name -eq 'toonflowPortable/runtime/Resources/version.json') {
                $reader = [IO.StreamReader]::new($entry.Open())
                try { $version = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
              }
            }
          } finally { $zip.Dispose() }
          if (!$entries.Contains('toonflowPortable/toonflow.exe') -or !$entries.Contains('toonflowPortable/runtime/Resources/app/portableLauncher.exe') -or !$version -or $version.version -ne $manifest.version -or $version.hash -ne $manifest.hash -or $version.distribution -ne 'portable' -or $version.baseUrl -ne "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/latest/download") { throw 'ZIP 与在线更新包版本、启动器或更新源不一致' }
          Write-Output "便携包 $env:releaseVersion 校验通过"
      - name: 上传草稿、核对远程校验值并正式发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $tag = "portable-v$env:releaseVersion"
          $latest = Invoke-RestMethod "$api/releases/latest" -Headers $headers -TimeoutSec 30
          if ($latest.tag_name -notmatch '^portable-v(\d+\.\d+\.\d+)$' -or [version]$env:releaseVersion -le [version]$Matches[1]) { throw '正式版本已变化，停止发布旧版本或相同版本' }
          foreach ($endpoint in @("git/ref/tags/$tag", "releases/tags/$tag")) {
            $existing = Invoke-WebRequest "$api/$endpoint" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 30
            if ($existing.StatusCode -eq 200) { throw '同名版本已存在；不覆盖正式版本或失败草稿，请先检查 Releases' }
            if ($existing.StatusCode -ne 404) { throw "无法确认版本是否存在：HTTP $($existing.StatusCode)" }
          }
          $notesRequest = @{ tag_name = $tag; target_commitish = $env:GITHUB_SHA; previous_tag_name = $latest.tag_name } | ConvertTo-Json
          $notes = Invoke-RestMethod "$api/releases/generate-notes" -Method Post -Headers $headers -ContentType 'application/json' -Body $notesRequest -TimeoutSec 30
          $body = @"
          Windows x64 便携版 $env:releaseVersion。

          已有便携版：在「设置 → 关于」使用 GitHub（Toonflow-l），依次点击「检查更新 → 下载更新 → 重启并更新」。更新前请保存内容并等待生成任务完成。

          首次使用：下载 toonflowPortable.zip，完整解压到 D 盘可写目录后双击 toonflow.exe。需要已安装 Microsoft Edge WebView2 Runtime 120 或更新版本。另外两个附件供应用自动更新使用。

          构建来自仓库提交 $env:GITHUB_SHA，不包含本机配置或 API 密钥。已完成类型检查、构建与发布包校验；自动发布流程不调用模型生成接口，不进行桌面交互验证。

          $($notes.body)
          "@
          $payload = @{ tag_name = $tag; target_commitish = $env:GITHUB_SHA; name = "Toonflow-l $env:releaseVersion（Windows 便携版）"; body = $body; draft = $true; prerelease = $false; make_latest = 'false' } | ConvertTo-Json
          $release = Invoke-RestMethod "$api/releases" -Method Post -Headers $headers -ContentType 'application/json' -Body $payload -TimeoutSec 30
          $names = @('toonflowPortable.zip', 'stable-win-x64-toonflowPortable.tar.zst', 'stable-win-x64-portable-update.json')
          $paths = @($names | ForEach-Object { Join-Path $env:artifactDirectory $_ })
          gh release upload $tag @paths --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw '附件上传失败，草稿已保留，当前正式版不变' }
          $uploaded = Invoke-RestMethod "$api/releases/$($release.id)" -Headers $headers -TimeoutSec 30
          if (!$uploaded.draft -or $uploaded.target_commitish -ne $env:GITHUB_SHA -or $uploaded.assets.Count -ne $names.Count) { throw '远程草稿或附件数量不一致，停止发布' }
          foreach ($name in $names) {
            $assets = @($uploaded.assets | Where-Object name -eq $name)
            $file = Get-Item -LiteralPath (Join-Path $env:artifactDirectory $name)
            $digest = 'sha256:' + (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($assets.Count -ne 1 -or $assets[0].state -ne 'uploaded' -or $assets[0].size -ne $file.Length -or $assets[0].digest -ne $digest) { throw '远程附件校验失败，草稿已保留' }
          }
          $publish = @{ draft = $false; prerelease = $false; make_latest = 'true' } | ConvertTo-Json
          $published = Invoke-RestMethod "$api/releases/$($release.id)" -Method Patch -Headers $headers -ContentType 'application/json' -Body $publish -TimeoutSec 30
          $latest = Invoke-RestMethod "$api/releases/latest" -Headers $headers -TimeoutSec 30
          if ($published.draft -or $latest.id -ne $published.id) { throw '发布状态与最新版标记未匹配，请检查 Releases' }
          "[下载 Toonflow-l $env:releaseVersion]($($published.html_url))" >> $env:GITHUB_STEP_SUMMARY
